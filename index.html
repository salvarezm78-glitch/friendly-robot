<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BidBattle</title>
<style>
:root{--bg:#080d19;--p:#141c32;--p2:#1d2847;--line:#2e3a5d;--txt:#f7f8fc;--mut:#9aa7c6;--gold:#ffc857;--org:#ff8a3d;--blue:#7d96ff;--red:#ff6b7a;--green:#49d49a}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#263462,#0b1020 42%,#070a12);color:var(--txt);font-family:Inter,system-ui,sans-serif}
button,input{font:inherit}.wrap{max-width:1360px;margin:auto;padding:16px 12px 40px}.brand{font-size:28px;font-weight:1000;letter-spacing:-.05em;margin-bottom:18px}.brand span{color:var(--gold)}
.card{background:linear-gradient(180deg,rgba(29,40,71,.97),rgba(14,20,37,.98));border:1px solid var(--line);border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.center{max-width:560px;margin:8vh auto;padding:28px}.ey{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:900}h1{font-size:clamp(42px,8vw,70px);line-height:.92;letter-spacing:-.06em;margin:12px 0}.sub{color:var(--mut);line-height:1.55}
.field{display:flex;flex-direction:column;gap:7px;margin:15px 0}.field label{font-size:12px;color:var(--mut);font-weight:800}.input{width:100%;padding:14px 15px;border-radius:14px;border:1px solid var(--line);background:#0b1224;color:white;outline:none}.input:focus{border-color:var(--blue)}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:950;cursor:pointer}.btn:disabled{opacity:.4}.pri{background:linear-gradient(135deg,var(--gold),var(--org));color:#1a1208}.sec{background:#222d4e;color:white;border:1px solid var(--line)}.bad{background:rgba(255,107,122,.13);color:#ffb2ba;border:1px solid rgba(255,107,122,.22)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.error{display:none;margin-top:12px;padding:10px 12px;border-radius:12px;background:rgba(255,107,122,.1);border:1px solid rgba(255,107,122,.2);color:#ffb2ba;font-size:13px}.error.on{display:block}
.wait{max-width:640px;margin:8vh auto;text-align:center;padding:28px}.code{font-size:clamp(54px,12vw,88px);font-weight:1000;letter-spacing:.12em;color:var(--gold);margin:12px 0}.tiny{font-size:12px;color:var(--mut)}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.pill{border:1px solid rgba(255,200,87,.25);background:rgba(255,200,87,.08);color:#ffdc87;border-radius:999px;padding:8px 12px;font-size:11px;font-weight:900}
.arena{display:grid;grid-template-columns:minmax(250px,1fr) minmax(320px,.78fr) minmax(250px,1fr);gap:16px}.player,.auction{padding:17px}.player.active{border-color:rgba(125,150,255,.7)}.ptop{display:flex;justify-content:space-between}.name{font-size:21px;font-weight:950}.you{font-size:9px;background:#a9b9ff;color:#0f1528;border-radius:999px;padding:4px 6px}.money{font-size:27px;font-weight:1000;color:var(--gold)}
.dish{aspect-ratio:1/1;display:grid;place-items:center;border-radius:20px;background:radial-gradient(circle,rgba(255,255,255,.07),rgba(255,255,255,.01) 68%);margin:10px 0}.dish svg{width:100%;height:100%}.chips{display:flex;gap:6px;flex-wrap:wrap;min-height:32px}.chip{font-size:10px;padding:6px 8px;border:1px solid var(--line);background:#0c1428;border-radius:999px;color:#cbd4e8}
.auction{text-align:center;display:flex;flex-direction:column;justify-content:center}.item{font-size:30px;font-weight:1000;letter-spacing:-.04em;margin:5px 0}.preview{width:210px;aspect-ratio:1;margin:auto}.preview svg{width:100%;height:100%}.bidlab{font-size:11px;color:var(--mut);font-weight:900}.price{font-size:52px;font-weight:1000;line-height:1}.leader{height:22px;font-size:13px;color:#ffd477;margin-top:4px}.track{height:9px;background:#0a1020;border-radius:999px;overflow:hidden;margin-top:13px}.bar{height:100%;background:linear-gradient(90deg,var(--green),var(--gold),var(--red));width:100%}.time{font-size:12px;color:var(--mut);margin:5px 0 10px}.turn{font-weight:900;min-height:22px;margin-bottom:10px}
.bidrow{display:grid;grid-template-columns:44px 1fr 44px;gap:7px}.step{border:1px solid var(--line);background:#222d4e;color:white;border-radius:12px;font-size:22px}.amt{display:grid;place-items:center;border:1px solid var(--line);background:#0b1224;border-radius:12px;font-size:20px;font-weight:950}.actions{display:grid;grid-template-columns:1.25fr .75fr;gap:7px;margin-top:8px}
.finish{max-width:1000px;margin:4vh auto;padding:26px;text-align:center}.finishgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
@media(max-width:980px){.arena{grid-template-columns:1fr 1fr}.auction{grid-column:1/-1;grid-row:1}.preview{width:150px}}
@media(max-width:620px){.wrap{padding:10px 8px 25px}.center,.wait{margin:3vh auto;padding:21px}.arena{grid-template-columns:1fr;gap:9px}.auction{grid-column:auto;position:sticky;top:5px;z-index:3;padding:13px}.player{padding:12px}.dish{aspect-ratio:1.15/1}.finishgrid{grid-template-columns:1fr}.name{font-size:17px}.money{font-size:22px}}
</style>
</head>
<body><div class="wrap"><div class="brand">Bid<span>Battle</span></div><main id="app"></main></div>
<script>
const API='https://qvsmmynfmrjxveblseau.supabase.co/functions/v1/bidbattle-live',app=document.getElementById('app');
let token=localStorage.bb_token||'',refresh=localStorage.bb_refresh||'',gid=localStorage.bb_gid||'',S=null,poll=null,timer=null,bid=1,busy=false;
const e=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const $=n=>'$'+Number(n||0).toFixed(0);
function error(m){const x=document.querySelector('.error');if(x){x.textContent=String(m).replaceAll('_',' ');x.classList.add('on')}}
async function req(body,auth=true,retry=true){
 const h={'Content-Type':'application/json'};if(auth&&token)h.Authorization='Bearer '+token;
 const r=await fetch(API,{method:'POST',headers:h,body:JSON.stringify(body)}),j=await r.json().catch(()=>({error:'invalid_response'}));
 if(r.status===401&&auth&&refresh&&retry){try{const rr=await req({action:'refresh_session',refresh_token:refresh},false,false);token=rr.access_token;refresh=rr.refresh_token;localStorage.bb_token=token;localStorage.bb_refresh=refresh;return req(body,auth,false)}catch{}}
 if(!r.ok)throw new Error(j.error||'request_failed');return j
}
function login(){stop();app.innerHTML='<section class="card center"><div class="ey">Juego privado para dos</div><h1>Construye.<br>Puja. Gana.</h1><p class="sub">Cada uno recibe $20. El plato se actualiza cada vez que alguien gana un ingrediente.</p><div class="field"><label>CLAVE DE PAREJA</label><input id="key" class="input" placeholder="BB-7429"></div><button id="enter" class="btn pri" style="width:100%">ENTRAR</button><div class="error"></div></section>';document.getElementById('enter').onclick=doLogin;document.getElementById('key').onkeydown=x=>{if(x.key==='Enter')doLogin()}}
async function doLogin(){if(busy)return;busy=true;try{const j=await req({action:'guest_session',code:document.getElementById('key').value.trim().toUpperCase()},false,false);token=j.access_token;refresh=j.refresh_token;localStorage.bb_token=token;localStorage.bb_refresh=refresh;lobby()}catch(x){error(x.message.includes('invalid_couple_code')?'Clave incorrecta':x.message)}finally{busy=false}}
function lobby(){stop();app.innerHTML='<section class="card center"><div class="ey">🍝 CREA UNA PASTA</div><h1 style="font-size:52px">BidBattle</h1><p class="sub">5 ingredientes por persona · $20 de presupuesto · 20 segundos por decisión.</p><div class="field"><label>TU NOMBRE</label><input id="name" class="input" maxlength="30" value="'+e(localStorage.bb_name||'')+'"></div><div class="grid2"><button id="create" class="btn pri">CREAR PARTIDA</button><button id="show" class="btn sec">UNIRSE</button></div><div id="joinbox" style="display:none"><div class="field"><label>CÓDIGO DE SALA</label><input id="room" class="input" maxlength="6" style="text-transform:uppercase;letter-spacing:.15em"></div><button id="join" class="btn pri" style="width:100%">UNIRSE</button></div><div class="error"></div></section>';document.getElementById('show').onclick=()=>document.getElementById('joinbox').style.display='block';document.getElementById('create').onclick=create;document.getElementById('join').onclick=join}
function name(){const n=document.getElementById('name').value.trim();if(!n){error('Escribe tu nombre');return null}localStorage.bb_name=n;return n}
async function create(){const n=name();if(!n)return;try{const j=await req({action:'create_game',display_name:n});gid=j.data.game_id;localStorage.bb_gid=gid;start()}catch(x){error(x.message)}}
async function join(){const n=name();if(!n)return;try{const j=await req({action:'join_game',display_name:n,room_code:document.getElementById('room').value.trim().toUpperCase()});gid=j.data.game_id;localStorage.bb_gid=gid;start()}catch(x){error(x.message)}}
function stop(){if(poll)clearInterval(poll);if(timer)clearInterval(timer);poll=timer=null}
async function load(){try{const j=await req({action:'state',game_id:gid});S=j.state;renderGame();return true}catch(x){if(x.message.includes('not_a_player')||x.message.includes('game_not_found')){delete localStorage.bb_gid;gid='';lobby()}return false}}
async function start(){stop();await load();poll=setInterval(load,700)}
function shape(s){const m={marinara:'<ellipse cx="150" cy="154" rx="84" ry="55" fill="#d94738" opacity=".82"/>',alfredo:'<ellipse cx="150" cy="154" rx="84" ry="55" fill="#f3e7c9" opacity=".88"/>',pesto:'<ellipse cx="150" cy="154" rx="84" ry="55" fill="#5d9c57" opacity=".78"/>',meatballs:'<g fill="#7a3f28"><circle cx="112" cy="135" r="16"/><circle cx="158" cy="169" r="17"/><circle cx="196" cy="132" r="15"/></g>',sausage:'<g fill="#9b4f38"><rect x="101" y="128" width="58" height="17" rx="8" transform="rotate(-18 130 136)"/><rect x="157" y="162" width="55" height="17" rx="8" transform="rotate(20 185 170)"/></g>',chicken:'<g fill="#d99b5e"><path d="M103 139l24-18 24 13-7 24-28 4z"/><path d="M161 174l20-20 25 12-3 25-27 6z"/></g>',shrimp:'<g fill="none" stroke="#f18b6a" stroke-width="10" stroke-linecap="round"><path d="M110 150q20-24 39 2"/><path d="M164 178q22-23 39 3"/></g>',bacon:'<path d="M101 136q18-12 34 0t35 0t34 0" fill="none" stroke="#bc4d42" stroke-width="12" stroke-linecap="round"/>',parmesan:'<g fill="#f7e7a9"><circle cx="107" cy="137" r="4"/><circle cx="129" cy="157" r="4"/><circle cx="151" cy="134" r="4"/><circle cx="173" cy="174" r="4"/></g>',mozzarella:'<g fill="#fff7dd"><ellipse cx="120" cy="146" rx="18" ry="12"/><ellipse cx="166" cy="181" rx="20" ry="13"/></g>',garlic:'<g fill="#f3e1b8"><ellipse cx="115" cy="152" rx="7" ry="4"/><ellipse cx="150" cy="184" rx="7" ry="4"/></g>',basil:'<g fill="#397a45"><ellipse cx="115" cy="142" rx="8" ry="14"/><ellipse cx="181" cy="165" rx="8" ry="14"/></g>',mushrooms:'<g fill="#c8aa83"><path d="M104 151q12-18 25 0z"/><rect x="114" y="151" width="6" height="11"/><path d="M166 183q13-18 27 0z"/></g>',spinach:'<g fill="#4f8b55"><path d="M107 166q10-25 25-5q-7 18-25 5"/><path d="M169 143q10-24 25-5q-7 18-25 5"/></g>',garlic_bread:'<g transform="translate(211 196) rotate(18)"><rect width="54" height="24" rx="10" fill="#d49a52"/><path d="M8 7h36" stroke="#f4d183" stroke-width="3"/></g>'};return m[s]||''}
function dish(slugs){const sauces=['marinara','alfredo','pesto'].filter(x=>slugs.includes(x)),tops=slugs.filter(x=>!['marinara','alfredo','pesto'].includes(x));return '<svg viewBox="0 0 300 300"><ellipse cx="150" cy="177" rx="112" ry="86" fill="#d8e0ee"/><ellipse cx="150" cy="163" rx="98" ry="72" fill="#f8fbff"/><ellipse cx="150" cy="157" rx="83" ry="55" fill="#f1c764"/><g fill="none" stroke="#dcae49" stroke-width="5" stroke-linecap="round"><path d="M84 147q37 28 84 1t52 12"/><path d="M91 169q34-24 66 3t61-7"/><path d="M102 190q25-25 49-3t50-2"/></g>'+sauces.map(shape).join('')+tops.map(shape).join('')+'</svg>'}
const A=id=>(S.acquisitions||[]).filter(x=>x.player_id===id);
function card(p){if(!p)return '<section class="card player"></section>';const a=A(p.id),slugs=a.map(x=>x.item&&x.item.slug).filter(Boolean),mine=p.user_id===S.me_user_id,active=p.id===S.game.active_bidder_player_id;return '<section class="card player '+(active?'active':'')+'"><div class="ptop"><div><div class="name">'+e(p.display_name)+' '+(mine?'<span class="you">YOU</span>':'')+'</div><div class="tiny">'+p.items_count+'/'+S.game.max_items+' ingredientes</div></div><div style="text-align:right"><div class="money">'+$(p.budget_remaining)+'</div><div class="tiny">restantes</div></div></div><div class="dish">'+dish(slugs)+'</div><div class="chips">'+(a.length?a.map(x=>'<span class="chip">'+e(x.item.name)+' · '+$(x.amount)+'</span>').join(''):'<span class="tiny">Aún sin ingredientes</span>')+'</div></section>'}
const who=id=>((S.players||[]).find(x=>x.id===id)||{}).display_name||'—';
function wait(){app.innerHTML='<section class="card wait"><div class="ey">ESPERANDO AL SEGUNDO JUGADOR</div><div class="code">'+e(S.game.room_code)+'</div><p class="sub">Comparte este código con tu pareja.</p><button id="copy" class="btn pri">COPIAR CÓDIGO</button></section>';document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(S.game.room_code)}
function intro(){
 const me=S.players.find(x=>x.user_id===S.me_user_id),host=me&&me.user_id===S.game.host_user_id;
 app.innerHTML='<section class="card center"><div class="ey">ANTES DE EMPEZAR</div><h1 style="font-size:50px">🍝 CREA UNA PASTA</h1><p class="sub">Van a construir una pasta por subasta. Cada uno empieza con <b>$20</b>, debe terminar con <b>5 ingredientes</b> y tendrá <b>20 segundos</b> cada vez que le toque decidir si sube la puja o pasa.</p><div style="margin:18px 0;padding:15px;border:1px solid var(--line);border-radius:16px;background:#0b1224;text-align:left"><div class="tiny" style="margin-bottom:6px">REGLAS</div><div style="line-height:1.6">• La puja más alta gana el ingrediente.<br>• El dinero gastado se descuenta del presupuesto.<br>• Al llegar a 5 ingredientes ya no puedes comprar más.<br>• El plato se actualiza visualmente después de cada compra.</div></div>'+(host?'<button id="startGame" class="btn pri" style="width:100%">EMPEZAR SUBASTA</button>':'<div class="pill" style="display:inline-block;margin-top:6px">Esperando a que el anfitrión empiece…</div>')+'<div class="error"></div></section>';
 if(host)document.getElementById('startGame').onclick=()=>act('start_game',{});
}
function finish(){const p1=S.players.find(x=>x.position===1),p2=S.players.find(x=>x.position===2);app.innerHTML='<section class="card finish"><div class="ey">PARTIDA TERMINADA</div><h1 style="font-size:56px">🏆</h1><div class="finishgrid">'+card(p1)+card(p2)+'</div><button id="again" class="btn pri" style="margin-top:18px">NUEVA PARTIDA</button></section>';document.getElementById('again').onclick=()=>{delete localStorage.bb_gid;gid='';S=null;lobby()}}
function renderGame(){if(!S)return;if(S.game.status==='waiting'){wait();return}if(S.game.status==='intro'){intro();return}if(S.game.status==='finished'){finish();return}
const g=S.game,q=S.current,p1=S.players.find(x=>x.position===1),p2=S.players.find(x=>x.position===2),me=S.players.find(x=>x.user_id===S.me_user_id),my=me&&me.id===g.active_bidder_player_id&&me.items_count<g.max_items,min=Math.max(1,Number(g.current_bid)+1),reserve=Math.max(g.max_items-(Number(me?.items_count||0)+1),0),safe=Math.max(0,Number(me?.budget_remaining||0)-reserve);if(bid<min||bid>safe)bid=Math.min(Math.max(min,1),safe);
app.innerHTML='<div class="head"><div class="pill">RONDA '+g.round_no+'</div><div class="tiny">'+e(g.room_code)+'</div></div><div class="arena">'+card(p1)+'<section class="card auction"><div class="ey">ITEM EN SUBASTA</div><div class="item">'+e(q?.item?.name||'—')+'</div><div class="preview">'+dish(q?.item?[q.item.slug]:[])+'</div><div class="bidlab">PUJA ACTUAL</div><div class="price">'+$(g.current_bid)+'</div><div class="leader">'+(g.highest_bidder_player_id?e(who(g.highest_bidder_player_id)):'Sin pujas todavía')+'</div><div class="track"><div id="bar" class="bar"></div></div><div id="time" class="time">20.0s</div><div class="turn">'+(my?'TU TURNO':'Esperando a '+e(who(g.active_bidder_player_id)))+'</div><div class="bidrow"><button id="minus" class="step" '+(!my?'disabled':'')+'>−</button><div class="amt">'+$(bid)+'</div><button id="plus" class="step" '+(!my?'disabled':'')+'>+</button></div><div class="actions"><button id="bid" class="btn pri" '+(!my||bid<min||bid>safe?'disabled':'')+'>PUJAR '+$(bid)+'</button><button id="pass" class="btn bad" '+(!my?'disabled':'')+'>PASAR</button></div><div class="error"></div></section>'+card(p2)+'</div>';
document.getElementById('minus').onclick=()=>{bid=Math.max(min,bid-1);renderGame()};document.getElementById('plus').onclick=()=>{bid=Math.min(safe,bid+1);renderGame()};document.getElementById('bid').onclick=()=>act('place_bid',{amount:bid});document.getElementById('pass').onclick=()=>act('pass',{});clock()}
async function act(action,x){try{await req(Object.assign({action,game_id:gid},x));await load()}catch(z){error(z.message.includes('reserve_budget_required')?'Debes reservar al menos $1 por cada ingrediente que todavía te falta comprar.':z.message)}}
function clock(){if(timer)clearInterval(timer);const end=new Date(S.game.bid_deadline).getTime();timer=setInterval(async()=>{const left=Math.max(0,end-Date.now()),pct=Math.max(0,Math.min(100,left/200)),b=document.getElementById('bar'),tx=document.getElementById('time');if(b)b.style.width=pct+'%';if(tx)tx.textContent=(left/1000).toFixed(1)+'s';if(left<=0){clearInterval(timer);try{await req({action:'resolve_timeout',game_id:gid});await load()}catch{}}},80)}
if(!token)login();else if(gid)start();else lobby();
</script></body></html>
